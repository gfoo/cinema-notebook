name: Fetch favicons
# temporary bootstrap

on:
  push:
    paths:
      - ".github/workflows/fetch-favicons.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official favicons
        run: |
          mkdir -p assets/favicons
          curl -fL "https://fr.wikipedia.org/favicon.ico" -o assets/favicons/wikipedia.ico
          curl -fL "https://www.imdb.com/favicon.ico" -o assets/favicons/imdb.ico
          curl -fL "https://www.rottentomatoes.com/assets/pizza-pie/images/favicon.ico" -o assets/favicons/rottentomatoes.ico
          curl -fL "https://www.allocine.fr/favicon.ico" -o assets/favicons/allocine.ico
      - name: Commit favicons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/favicons
          git diff --cached --quiet && exit 0
          git commit -m "Add official site favicons"
          git push
