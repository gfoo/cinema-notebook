---
layout: null
---
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cinéma</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#171717;background:#f5f3ef}
*{box-sizing:border-box}body{margin:0}.app{max-width:1200px;margin:auto;padding:36px 24px}
h1{font-size:2.3rem;margin:0 0 6px}.intro{color:#666;margin:0 0 22px}
.view-switcher{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.view-buttons{display:inline-flex;gap:3px;padding:3px;border:1px solid #d5d0c8;border-radius:11px;background:#eeeae4}
.view-button{font:inherit;border:0;background:transparent;border-radius:8px;padding:7px 11px;cursor:pointer;color:#666}
.view-button.active{background:white;color:#171717;box-shadow:0 1px 3px #0001}
.view-icon{font-size:1rem}
.status-filter{border:0;border-radius:999px;padding:5px 10px;font:inherit;font-size:.8rem;white-space:nowrap;cursor:pointer}
.status-filter:hover{filter:brightness(.97)}
.status-filter.all{background:#eeeae4;color:#555}
.status-filter.seen{background:#dcebdc;color:#333}
.status-filter.to_watch{background:#e9e2d5;color:#333}
.filters{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:10px}
select,input{font:inherit;padding:11px 13px;border:1px solid #d5d0c8;border-radius:10px;background:white}
.grid{display:grid;gap:4px}.film{background:white;border:1px solid #ddd8d0;border-radius:6px;overflow:hidden}.film-row{min-height:42px;padding:7px 12px;display:flex;justify-content:space-between;align-items:center;gap:16px;cursor:pointer}.film-detail{display:none;padding:12px;border-top:1px solid #eee9e2;background:#faf9f7;gap:14px;align-items:flex-start}.film.open .film-detail{display:flex}.film-detail img{width:54px;height:78px;object-fit:cover;border-radius:4px;flex:0 0 auto}.film-detail-body{min-width:0}.film-detail-title{font-weight:650}.film-detail-meta{color:#777;font-size:.84rem;margin-top:3px}.film-detail .links{margin-top:7px}.film-detail .links a{font-size:.78rem}
.list-title{font-size:1rem;font-weight:600;line-height:1.2}.list-meta{color:#777;font-size:.82rem;margin-top:2px}
.status{border:0;border-radius:999px;padding:5px 10px;font:inherit;font-size:.8rem;white-space:nowrap}.seen{background:#dcebdc}.to_watch{background:#e9e2d5}.film-actions{display:flex;align-items:center;gap:6px}.info-button{width:28px;height:28px;border:1px solid #d5d0c8;border-radius:50%;background:white;color:#666;font-weight:700;cursor:pointer}.meta-dialog{width:min(520px,calc(100% - 32px));border:1px solid #d5d0c8;border-radius:14px;padding:0;background:white;box-shadow:0 12px 40px #0003}.meta-dialog::backdrop{background:#0006}.meta-dialog-inner{padding:20px}.meta-dialog-header{display:flex;justify-content:space-between;align-items:center;font-size:1.2rem}.meta-dialog-header button{border:0;background:transparent;font-size:1.4rem;cursor:pointer}.meta-item{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid #eee9e2}.meta-label{color:#777;font-size:.85rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px}
.card{background:white;border:1px solid #ddd8d0;border-radius:14px;overflow:hidden}.poster{width:100%;aspect-ratio:2/3;object-fit:cover;background:#e8e5df;display:block}
.card-body{padding:12px}.card .title{font-size:1rem}.card .status{margin-top:10px;font-size:.85rem;padding:6px 10px}
.timeline-wrap{overflow-x:auto;padding-bottom:12px}.timeline{display:flex;gap:14px;min-width:max-content;align-items:flex-start}
.year-column{width:170px;flex:0 0 170px}.year{font-size:1.35rem;font-weight:700;padding:8px 4px 12px;border-bottom:2px solid #171717;margin-bottom:12px}
.year-films{display:grid;gap:14px}.timeline .card{width:170px}
.empty{color:#777;padding:25px 0}.sentinel{height:20px}
.links{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}.source-link{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:1px solid #d5d0c8;border-radius:8px;background:white;text-decoration:none;overflow:hidden}.source-link:hover{background:#f0ede8}.source-link img{width:22px;height:22px;object-fit:cover;border-radius:6px;display:block}.source-link.imdb img{width:24px;height:24px}.source-link.tomato img{width:24px;height:24px}
@media(max-width:650px){.view-switcher{gap:10px}.view-button{padding:7px 9px}.film-row{padding:7px 10px}.film-detail{padding:10px}.status{padding:5px 9px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<main class="app">
<div class="filters">
  <input id="author" placeholder="Rechercher dans les films…">
</div>

<div class="view-switcher">
  <div class="view-buttons" role="group" aria-label="Vue">
    <button class="view-button active" data-view="list" title="Liste" aria-label="Liste"><span class="view-icon">☷</span></button>
    <button class="view-button" data-view="cards" title="Vignettes" aria-label="Vignettes"><span class="view-icon">▦</span></button>
    <button class="view-button" data-view="timeline" title="Frise" aria-label="Frise"><span class="view-icon">─</span></button>
  </div>
  <button id="status" class="status status-filter all" type="button" title="Filtrer par statut" aria-label="Filtre de statut">Tous</button>
</div>

<section id="films"></section>
<div id="sentinel" class="sentinel"></div>
<dialog id="meta-dialog" class="meta-dialog"><div class="meta-dialog-inner"><div class="meta-dialog-header"><strong id="meta-dialog-title"></strong><button id="meta-close" type="button" aria-label="Fermer">×</button></div><div id="meta-content"></div></div></dialog>
</main>

<script>
const films={{ site.data.films.films | jsonify }};
const viewConfig={{ site.data.views | jsonify }};

const labels={seen:"Vu",to_watch:"À voir"};
const fieldLabels={titre:"Titre",année:"Année",auteur:"Auteur",acteurs_principaux:"Acteurs principaux",statut:"Statut",date_vue:"Date de visionnage"};
function valueFor(f,field){if(field==="statut")return labels[f[field]]||f[field]||"";return f[field]??""}
function infoButton(f){return '<button class="info-button" type="button" data-info="'+f.id+'" aria-label="Informations sur '+f.titre+'" title="Toutes les informations">i</button>}
function metadataDialog(f){const excluded=["id","thumb_url","sources"];let html="";Object.keys(f).forEach(k=>{if(!excluded.includes(k)){const v=k==="statut"?(labels[f[k]]||f[k]):(f[k]||"—");html+='<div class="meta-item"><div class="meta-label">'+(fieldLabels[k]||k.replaceAll("_"," "))+"</div><div>"+v+"</div></div>"}});html+=f.sources?sourceLinks(f):"";return html}

const author=document.querySelector("#author"),status=document.querySelector("#status");
const statusModes=["","seen","to_watch"],statusLabels=["Tous","Vu","À voir"];
let statusIndex=0;
const root=document.querySelector("#films"),sentinel=document.querySelector("#sentinel");
let currentView="list",offset=0,pageSize=24,filtered=[];

function sourceLinks(f){
  const s=f.sources||{};
  const links=[
    s.wikipedia?['https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/74/4d/87/744d87ec-852d-79a5-22e1-4375bf4108f5/AppIcon-0-1x_U007emarketing-0-0-0-8-0-0-sRGB-85-220-0.png/1200x630wa.png','Wikipedia','']:null,
    s.imdb?['https://images.squarespace-cdn.com/content/v1/63c6e28fd72e1164cb2cdcfd/9794d573-cecc-43ac-8a13-6b666f57cb15/IMDB.png','IMDb','imdb']:null,
    s.rotten_tomatoes?['https://fastly.mwm-storage.mwmcdn.com/raw_files/073ee4e9-9ffb-447c-8381-f1956985ed54','Rotten Tomatoes','tomato']:null
  ].filter(Boolean);
  return links.length
    ? `<div class="links">${links.map(([icon,label,cls])=>`<a class="source-link ${cls}" href="${s[label==='Wikipedia'?'wikipedia':label==='IMDb'?'imdb':'rotten_tomatoes']}" target="_blank" rel="noopener" aria-label="${label}" title="${label}"><img src="${icon}" alt="" loading="lazy"></a>`).join("")}</div>`
    : "";
}
function card(f){
  return `<article class="card">
    <a href="${f.sources?.wikipedia||f.sources?.imdb||f.sources?.rotten_tomatoes||"#"}" target="_blank" rel="noopener"><img class="poster" src="${f.thumb_url||""}" alt="Affiche de ${f.titre}" loading="lazy"></a>
    <div class="card-body">
      ${viewConfig.cards.visible.includes("titre")?`<div class="title">${f.titre}</div>`:""}
      ${viewConfig.cards.visible.filter(k=>["année","auteur"].includes(k)).map(k=>valueFor(f,k)).filter(Boolean).join(" · ")?`<div class="meta">${viewConfig.cards.visible.filter(k=>["année","auteur"].includes(k)).map(k=>valueFor(f,k)).filter(Boolean).join(" · ")}</div>`:""}
      <div class="film-actions">${viewConfig.cards.visible.includes("statut")?`<button class="status ${f.statut}">${labels[f.statut]}</button>`:""}${infoButton(f)}</div>
      ${sourceLinks(f)}
    </div>
  </article>`;
}
function listItem(f){
  return `<article class="film" data-id="${f.id}">
    <div class="film-row" role="button" tabindex="0" aria-expanded="false">
      <div>${viewConfig.list.visible.includes("titre")?`<div class="list-title">${f.titre}${viewConfig.list.visible.includes("année")?` <span class="list-meta">(${f.année})</span>`:""}</div>`:""}${viewConfig.list.visible.includes("auteur")?`<div class="list-meta">${f.auteur}</div>`:""}</div>
      <div class="film-actions">${viewConfig.list.visible.includes("statut")?`<button class="status ${f.statut}" tabindex="-1">${labels[f.statut]}</button>`:""}${infoButton(f)}</div>
    </div>
    <div class="film-detail"><img src="${f.thumb_url||""}" alt="Affiche de ${f.titre}" loading="lazy"><div class="film-detail-body"><div class="film-detail-title">${f.titre}</div><div class="film-detail-meta">${f.année} · ${f.auteur}${f.date_vue&&f.date_vue!=="inconnue"?" · Vu le "+f.date_vue:""}</div>${sourceLinks(f)}</div></div>
  </article>`;
}
function bindListRows(){document.querySelectorAll(".film-row").forEach(row=>{if(row.dataset.bound)return;row.dataset.bound="1";const toggle=()=>{const film=row.closest(".film");const open=film.classList.toggle("open");row.setAttribute("aria-expanded",open)};row.addEventListener("click",toggle);row.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle()}})})}
function applyFilters(){
  const q=author.value.trim().toLowerCase(),s=statusModes[statusIndex];
  filtered=films.filter(f=>{
    const text=[f.titre,f.auteur,f.année,f.statut,labels[f.statut]].filter(v=>v!=null).join(" ").toLowerCase();
    return (!q||text.includes(q))&&(!s||f.statut===s);
  });
  offset=0;
  root.innerHTML="";
  renderMore();
}
function renderMore(){
  if(currentView==="timeline"){renderTimeline();return;}
  const batch=filtered.slice(offset,offset+pageSize);
  if(offset===0 && !batch.length){root.innerHTML='<div class="empty">Aucun film.</div>';return;}
  if(currentView==="list"){
    if(offset===0) root.innerHTML='<div class="grid" id="view-content"></div>';
    document.querySelector("#view-content").insertAdjacentHTML("beforeend",batch.map(listItem).join(""));
    bindListRows();
  } else {
    if(offset===0) root.innerHTML='<div class="cards" id="view-content"></div>';
    document.querySelector("#view-content").insertAdjacentHTML("beforeend",batch.map(card).join(""));
  }
  offset+=batch.length;
}
function renderTimeline(){
  if(!filtered.length){root.innerHTML='<div class="empty">Aucun film.</div>';return;}
  const years=[...new Set(filtered.map(f=>f.année))].sort((a,b)=>a-b);
  root.innerHTML='<div class="timeline-wrap"><div class="timeline">'+years.map(y=>`
    <section class="year-column">
      <div class="year">${y}</div>
      <div class="year-films">${filtered.filter(f=>f.année===y).map(card).join("")}</div>
    </section>`).join("")+'</div></div>';
}
function setView(view){
  currentView=view;
  document.querySelectorAll(".view-button").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
  applyFilters();
}
document.querySelectorAll(".view-button").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.view)));
const metaDialog=document.querySelector("#meta-dialog"),metaContent=document.querySelector("#meta-content"),metaTitle=document.querySelector("#meta-dialog-title");
document.addEventListener("click",e=>{const b=e.target.closest("[data-info]");if(b){e.stopPropagation();const f=films.find(x=>x.id===b.dataset.info);if(f){metaTitle.textContent=f.titre;metaContent.innerHTML=metadataDialog(f);metaDialog.showModal()}}});
document.querySelector("#meta-close").addEventListener("click",()=>metaDialog.close());
metaDialog.addEventListener("click",e=>{if(e.target===metaDialog)metaDialog.close()});
author.addEventListener("input",applyFilters);
function updateStatusButton(){status.textContent=statusLabels[statusIndex];status.className="status status-filter "+(statusModes[statusIndex]||"all")}
status.addEventListener("click",()=>{statusIndex=(statusIndex+1)%statusModes.length;updateStatusButton();applyFilters()});
const observer=new IntersectionObserver(entries=>{if(entries[0].isIntersecting&&currentView!=="timeline"&&offset<filtered.length)renderMore();},{rootMargin:"400px"});
observer.observe(sentinel);
updateStatusButton();
applyFilters();
</script>
</body>
</html>
