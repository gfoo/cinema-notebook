<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cinéma</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#171717;background:#f5f3ef}
*{box-sizing:border-box}body{margin:0}.app{max-width:900px;margin:auto;padding:48px 24px}
h1{font-size:2.4rem;margin:0 0 8px}.intro{color:#666;margin:0 0 32px}
.grid{display:grid;gap:14px}.film{background:white;border:1px solid #ddd8d0;border-radius:14px;padding:20px 22px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.title{font-size:1.2rem;font-weight:650}.year{color:#777;margin-left:8px}.status{border:0;border-radius:999px;padding:9px 14px;font:inherit;cursor:pointer;background:#eee9e1;color:#333}.status.seen{background:#dcebdc}.status.to_watch{background:#e9e2d5}
@media(max-width:600px){.app{padding:30px 16px}.film{align-items:flex-start;flex-direction:column}.status{width:100%}}
</style>
</head>
<body>
<main class="app">
<h1>🎬 Cinéma</h1>
<p class="intro">Mon carnet de films — pour l'instant, deux films.</p>
<section class="grid" id="films"></section>
</main>
<script>
const films=[
 {titre:"Blade Runner",année:1982,statut:"seen"},
 {titre:"Blade Runner 2049",année:2017,statut:"to_watch"}
];
const labels={seen:"Vu",to_watch:"À voir"};
const root=document.querySelector("#films");
function render(){root.innerHTML=films.map((f,i)=>`<article class="film"><div><span class="title">${f.titre}</span><span class="year">${f.année}</span></div><button class="status ${f.statut}" onclick="toggle(${i})">${labels[f.statut]}</button></article>`).join("")}
function toggle(i){films[i].statut=films[i].statut==="seen"?"to_watch":"seen";render()}
render();
</script>
</body>
</html>
