layout: null
---
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cinéma</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#171717;background:#f5f3ef}
*{box-sizing:border-box}body{margin:0}.app{max-width:1200px;margin:auto;padding:36px 24px}.theme-switch{position:fixed;top:10px;right:12px;width:30px;height:18px;border:1px solid #aaa;border-radius:999px;background:#ddd;padding:2px;cursor:pointer;z-index:20}.theme-switch span{display:block;width:12px;height:12px;border-radius:50%;background:#555;transition:transform .18s}.theme-switch input{position:absolute;opacity:0;pointer-events:none}.theme-switch:has(input:checked) span{transform:translateX(12px)}html:has(.theme-switch input:checked) .app,html:has(.theme-switch input:checked) .meta-dialog,html:has(.theme-switch input:checked) .theme-switch{filter:grayscale(1)}
h1{font-size:2.3rem;margin:0 0 6px}.intro{color:#666;margin:0 0 22px}
.view-switcher{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.view-buttons{display:inline-flex;gap:3px;padding:3px;border:1px solid #d5d0c8;border-radius:11px;background:#eeeae4}.view-button{font:inherit;border:0;background:transparent;border-radius:8px;padding:7px 11px;cursor:pointer;color:#666}.view-button.active{background:white;color:#171717;box-shadow:0 1px 3px #0001}.view-icon{font-size:1rem}.status-filter{border:0;border-radius:999px;padding:5px 10px;font:inherit;font-size:.8rem;white-space:nowrap;cursor:pointer}.status-filter:hover{filter:brightness(.97)}.status-filter.all{background:#eeeae4;color:#555}.status-filter.seen{background:#dcebdc;color:#333}.status-filter.to_watch{background:#e9e2d5;color:#333}.filters{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:10px}select,input{font:inherit;padding:11px 13px;border:1px solid #d5d0c8;border-radius:10px;background:white}
.grid{display:grid;gap:4px}.film{background:white;border:1px solid #ddd8d0;border-radius:6px;overflow:hidden}.film-row{min-height:42px;padding:7px 12px;display:flex;justify-content:space-between;align-items:center;gap:16px;cursor:pointer}.film-row-main{display:flex;align-items:center;gap:12px;min-width:0}.list-thumb{width:38px;height:57px;object-fit:cover;border-radius:4px;background:#e8e5df;flex:0 0 auto}.film-row-text{min-width:0}.film-detail{display:none;padding:12px;border-top:1px solid #eee9e2;background:#faf9f7;gap:14px;align-items:flex-start}.film.open .film-detail{display:flex}.film-detail img{width:54px;height:78px;object-fit:cover;border-radius:4px;flex:0 0 auto}.film-detail-body{min-width:0}.film-detail-title{font-weight:650}.film-detail-meta{color:#777;font-size:.84rem;margin-top:3px}.film-detail .links{margin-top:7px}.film-detail .links a{font-size:.78rem}.list-title{font-size:1rem;font-weight:600;line-height:1.2}.list-meta{color:#777;font-size:.82rem;margin-top:2px}.status{border:0;border-radius:999px;padding:5px 10px;font:inherit;font-size:.8rem;white-space:nowrap}.seen{background:#dcebdc}.to_watch{background:#dcebdc}.film-actions{display:flex;align-items:center;gap:6px}.info-button{width:auto;height:auto;border:0;border-radius:0;background:transparent;color:#555;font-weight:700;cursor:pointer;padding:0;font-size:1.05rem;line-height:1;align-self:center}.visibility-button{border:0;border-radius:999px;background:#dcebdc;color:#333;font:inherit;font-size:.8rem;line-height:1;cursor:pointer;padding:5px 10px;white-space:nowrap}.visibility-button:hover,.info-button:hover{filter:brightness(.97)}
.meta-dialog{width:min(520px,calc(100% - 32px));border:1px solid #d5d0c8;border-radius:14px;padding:0;background:white;box-shadow:0 12px 40px #0003}.meta-dialog::backdrop{background:#0006}.meta-dialog-inner{padding:20px}.meta-dialog-header{display:flex;justify-content:space-between;align-items:center;font-size:1.2rem}.meta-dialog-header button{border:0;background:transparent;font-size:1.4rem;cursor:pointer}.meta-item{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid #eee9e2}.meta-label{color:#777;font-size:.85rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,160px);gap:18px}.card{background:white;border:1px solid #ddd8d0;border-radius:14px;overflow:hidden}.poster-wrap{position:relative}.poster{width:100%;aspect-ratio:2/3;object-fit:cover;background:#e8e5df;display:block}.poster-actions{position:absolute;inset:8px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;pointer-events:none}.poster-top{display:flex;justify-content:space-between;align-items:flex-start;width:100%}.poster-year{background:white;color:#171717;font-size:.72rem;line-height:1;padding:5px 7px;border-radius:5px;box-shadow:0 1px 4px #0002}.poster-actions .info-button,.poster-actions .visibility-button{pointer-events:auto;box-shadow:0 1px 4px #0002}.poster-actions .info-button{background:white;color:#777;border-radius:5px;padding:4px 6px;font-size:.95rem}.card-body{padding:10px;display:flex;flex-direction:column;min-height:92px}.card .title{font-size:.9rem;font-weight:600;line-height:1.2}.card .meta{font-size:.82rem;line-height:1.3;margin-top:2px}.card-author{color:#555}.card-actors{color:#777}.card .status{margin-top:10px;font-size:.85rem;padding:6px 10px}.card .links{margin-top:auto}.timeline-wrap{overflow-x:auto;padding-bottom:12px}.timeline{display:flex;gap:18px;min-width:max-content;align-items:flex-start}.year-column{width:160px;flex:0 0 160px}.year{font-size:1.35rem;font-weight:700;padding:8px 4px 12px;border-bottom:2px solid #171717;margin-bottom:12px}.year-films{display:grid;gap:18px}.timeline .card{width:160px;flex:0 0 160px}.empty{color:#777;padding:25px 0}.sentinel{height:20px}.links{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}.film-actions .links{margin-top:0}.source-link{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:1px solid #d5d0c8;border-radius:8px;background:white;text-decoration:none;overflow:hidden}.source-link:hover{background:#f0ede8}.source-link img{width:22px;height:22px;object-fit:cover;border-radius:6px;display:block}.source-link.imdb img{width:24px;height:24px}.source-link.tomato img{width:24px;height:24px}@media(max-width:650px){.view-switcher{gap:10px}.view-button{padding:7px 9px}.film-row{min-height:0;padding:5px 8px;gap:8px}.film-row-main{gap:8px}.list-thumb{width:28px;height:42px;border-radius:3px}.list-title{font-size:.92rem}.list-meta{font-size:.75rem}.film-actions{gap:3px}.film-actions .links{gap:3px}.film-actions .source-link{width:24px;height:24px;border-radius:6px}.film-actions .source-link img{width:18px;height:18px}.film-actions .source-link.imdb img,.film-actions .source-link.tomato img{width:19px;height:19px}.film-actions .info-button{font-size:.9rem}.visibility-button{padding:4px 8px}.film-detail{padding:10px}.status{padding:5px 9px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<label id="theme-switch" class="theme-switch" title="Mode niveaux de gris" aria-label="Mode niveaux de gris"><input id="gray-toggle" type="checkbox"><span></span></label>
<main class="app"><div class="filters"><input id="author" placeholder="Rechercher dans les films…"></div><div class="view-switcher"><div class="view-buttons" role="group" aria-label="Vue"><button class="view-button active" data-view="list" title="Liste" aria-label="Liste"><span class="view-icon">☷</span></button><button class="view-button" data-view="cards" title="Vignettes" aria-label="Vignettes"><span class="view-icon">▦</span></button><button class="view-button" data-view="timeline" title="Frise" aria-label="Frise"><span class="view-icon">─</span></button></div><button id="status" class="status-filter all" type="button" title="Filtrer par statut" aria-label="Filtre de statut">Tous</button></div><section id="films"></section><div id="sentinel" class="sentinel"></div><dialog id="meta-dialog" class="meta-dialog"><div class="meta-dialog-inner"><div class="meta-dialog-header"><strong id="meta-dialog-title"></strong><button id="meta-close" type="button" aria-label="Fermer">×</button></div><div id="meta-content"></div></div></dialog></main>
<script type="application/json" id="films-data">{{ site.data.films.films | jsonify }}</script><script type="application/json" id="views-list-data">{{ site.data.views.list.visible | jsonify }}</script><script type="application/json" id="views-cards-data">{{ site.data.views.cards.visible | jsonify }}</script><script>
const labels={seen:"Vu",to_watch:"À voir"};const fieldLabels={titre:"Titre",année:"Année",auteur:"Auteur",acteurs_principaux:"Acteurs principaux",statut:"Statut",date_vue:"Date de visionnage"};const films=JSON.parse(document.querySelector("#films-data").textContent);const listVisible=JSON.parse(document.querySelector("#views-list-data").textContent);const cardsVisible=JSON.parse(document.querySelector("#views-cards-data").textContent);const root=document.querySelector("#films");const search=document.querySelector("#author");const statusButton=document.querySelector("#status");const viewButtons=document.querySelectorAll("[data-view]");const sentinel=document.querySelector("#sentinel");const dialog=document.querySelector("#meta-dialog");const dialogBody=document.querySelector("#meta-content");const dialogClose=document.querySelector("#meta-close");let currentView="list",statusIndex=0,offset=0;const pageSize=24;let filtered=films.slice();
function sourceLinks(f){const s=f.sources||{};const links=[s.wikipedia?{url:s.wikipedia,label:"Wikipedia",icon:"https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/74/4d/87/744d87ec-852d-79a5-22e1-4375bf4108f5/AppIcon-0-1x_U007emarketing-0-0-0-8-0-0-sRGB-85-220-0.png/1200x630wa.png"}:null,s.imdb?{url:s.imdb,label:"IMDb",icon:"https://images.squarespace-cdn.com/content/v1/63c6e28fd72e1164cb2cdcfd/9794d573-cecc-43ac-8a13-6b666f57cb15/IMDB.png"}:null,s.rotten_tomatoes?{url:s.rotten_tomatoes,label:"Rotten Tomatoes",icon:"https://fastly.mwm-storage.mwmcdn.com/raw_files/073ee4e9-9ffb-447c-8381-f1956985ed54"}:null].filter(Boolean);if(!links.length)return"";return '<div class="links">'+links.map(x=>'<a class="source-link" href="'+x.url+'" target="_blank" rel="noopener" aria-label="'+x.label+'" title="'+x.label+'"><img src="'+x.icon+'" alt="" loading="lazy"></a>').join("")+'</div>'}
function infoButton(f){return '<button class="info-button" type="button" data-info="'+f.id+'" aria-label="Informations sur '+f.titre+'" title="Toutes les informations">ⓘ</button>'}function visibilityButton(f){if(f.statut!=="to_watch")return"";return '<button class="visibility-button" type="button" data-visibility="'+f.id+'" aria-label="À voir" title="À voir">À voir</button>'}
function card(f){const showAuthor=cardsVisible.includes("auteur"),showActors=cardsVisible.includes("acteurs_principaux")&&f.acteurs_principaux,showSources=cardsVisible.includes("sources");return '<article class="card"><div class="poster-wrap"><a href="'+(f.sources?.wikipedia||"#")+'" target="_blank" rel="noopener"><img class="poster" src="'+(f.thumb_url||"")+'" alt="Affiche de '+f.titre+'" loading="lazy"></a><div class="poster-actions"><div class="poster-top">'+(cardsVisible.includes("année")?'<span class="poster-year">'+f.année+'</span>':"")+infoButton(f)+'</div>'+visibilityButton(f)+'</div></div><div class="card-body">'+(cardsVisible.includes("titre")?'<div class="title">'+f.titre+'</div>':"")+(showAuthor?'<div class="meta card-author">'+f.auteur+'</div>':"")+(showActors?'<div class="meta card-actors">'+f.acteurs_principaux+'</div>':"")+(showSources?sourceLinks(f):"")+'</div></article>'}
function listItem(f){const title=listVisible.includes("titre")?'<div class="list-title">'+f.titre+(listVisible.includes("année")?' <span class="list-meta">('+f.année+')</span>':"")+(f.statut==="to_watch"?" "+visibilityButton(f):"")+'</div>':"";const author=listVisible.includes("auteur")?'<div class="list-meta">'+f.auteur+(listVisible.includes("acteurs_principaux")&&f.acteurs_principaux?" | "+f.acteurs_principaux:"")+'</div>':"";return '<article class="film" data-id="'+f.id+'"><div class="film-row"><div class="film-row-main"><img class="list-thumb" src="'+(f.thumb_url||"")+'" alt="" loading="lazy"><div class="film-row-text">'+title+author+'</div></div><div class="film-actions">'+(listVisible.includes("sources")?sourceLinks(f):"")+infoButton(f)+'</div></div></article>'}
function renderTimeline(items){if(!items.length)return'<div class="empty">Aucun film</div>';const years=[...new Set(items.map(f=>f.année))].sort((a,b)=>b-a);return '<div class="timeline-wrap"><div class="timeline">'+years.map(year=>'<div class="year-column"><div class="year">'+year+'</div><div class="year-films">'+items.filter(f=>f.année===year).map(card).join("")+'</div></div>').join("")+'</div></div>'}function render(){if(currentView==="cards")root.innerHTML='<div class="cards">'+filtered.slice(0,offset+pageSize).map(card).join("")+'</div>';else if(currentView==="timeline")root.innerHTML=renderTimeline(filtered);else root.innerHTML=filtered.slice(0,offset+pageSize).map(listItem).join("")||'<div class="empty">Aucun film</div>';offset=Math.min(offset+pageSize,filtered.length)}function applyFilters(){const q=(search?.value||"").trim().toLowerCase(),status=statusIndex===1?"to_watch":"";filtered=films.filter(f=>{const haystack=Object.values(f).filter(v=>typeof v==="string"||typeof v==="number").join(" ").toLowerCase();return(!q||haystack.includes(q))&&(!status||f.statut===status)});offset=0;render()}
function openInfo(id){const f=films.find(x=>x.id===id);if(!f)return;const excluded=["id","thumb_url","sources"];dialogBody.innerHTML=Object.keys(f).filter(k=>!excluded.includes(k)).map(k=>'<div class="meta-item"><div class="meta-label">'+(fieldLabels[k]||k)+'</div><div>'+(k==="statut"?labels[f[k]]:(f[k]||"—"))+'</div></div>').join("")+sourceLinks(f);dialog.showModal()}search?.addEventListener("input",applyFilters);statusButton?.addEventListener("click",()=>{statusIndex=(statusIndex+1)%2;statusButton.textContent=statusIndex===0?"Tous":"À voir";statusButton.className="status-filter "+(statusIndex===0?"all":"to_watch");applyFilters()});viewButtons.forEach(button=>button.addEventListener("click",()=>{currentView=button.dataset.view;viewButtons.forEach(b=>b.classList.toggle("active",b===button));offset=0;render()}));document.addEventListener("click",event=>{const info=event.target.closest("[data-info]");if(info){event.preventDefault();event.stopPropagation();openInfo(info.dataset.info)}});dialogClose?.addEventListener("click",()=>dialog.close());sentinel?.addEventListener("click",()=>{if(offset<filtered.length)render()});applyFilters();
</script></body></html>
