  - id: terminator-1984
    titre: Terminator
    année: 1984
    auteur: James Cameron
    acteurs_principaux: Arnold Schwarzenegger, Michael Biehn, Linda Hamilton
    synopsis: En 1984, Sarah Connor est traquée par un cyborg venu du futur pour l'éliminer avant la naissance de son fils John, qui deviendra le chef de la résistance humaine contre les machines. Un soldat, Kyle Reese, est lui aussi envoyé dans le passé pour la protéger. Alors que le Terminator poursuit inlassablement sa cible, Sarah découvre l'ampleur de la guerre à venir et tente de survivre avec son protecteur.
