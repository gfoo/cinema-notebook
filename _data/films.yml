    titre: Blade Runner
    année: 1982
    auteur: Ridley Scott
    acteurs_principaux: Harrison Ford, Rutger Hauer, Sean Young
    synopsis: Dans un Los Angeles futuriste et décadent, Rick Deckard, ancien blade runner, est chargé de traquer quatre réplicants Nexus-6 revenus illégalement sur Terre. Au fil de son enquête, il rencontre Rachael, une réplicante dont l'identité remet en question ses certitudes. Sa chasse devient progressivement une réflexion sur l'humanité, la mémoire et la frontière entre l'homme et sa création artificielle et technologique.
