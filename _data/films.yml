  - id: heart-of-the-beast-2026
    titre: Heart of the Beast
    année: 2026
    auteur: David Ayer
    acteurs_principaux: Brad Pitt, J.K. Simmons, Anna Lambe
    synopsis: Après le crash de son avion en pleine nature sauvage de l'Alaska, James Belmont, ancien membre des forces spéciales, se retrouve isolé avec Odin, son chien de combat. Blessés et confrontés à un environnement hostile, ils doivent trouver les ressources nécessaires pour survivre. Leur relation et leur instinct de survie sont mis à l'épreuve alors qu'ils affrontent les dangers de cette région reculée.
