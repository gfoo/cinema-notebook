  - id: blade-runner-2049
    titre: Blade Runner 2049
    année: 2017
    auteur: Denis Villeneuve
    acteurs_principaux: Ryan Gosling, Harrison Ford, Ana de Armas
    synopsis: En 2049, K, un blade runner réplicant du LAPD, découvre un secret longtemps enfoui qui pourrait bouleverser l'équilibre entre humains et réplicants. Sa quête le conduit à rechercher Rick Deckard, disparu depuis des décennies. En remontant cette piste, K remet progressivement en question sa propre identité, tandis que les traces du passé menacent de transformer profondément le monde qu'il connaît.
