  - id: abyss-1989
    titre: Abyss
    année: 1989
    auteur: James Cameron
    acteurs_principaux: Ed Harris, Mary Elizabeth Mastrantonio, Michael Biehn
    synopsis: Après le naufrage mystérieux d'un sous-marin nucléaire, une équipe de plongeurs civils travaillant sur une plateforme sous-marine est réquisitionnée pour participer aux recherches. Alors que les tensions montent entre les techniciens et les militaires, Bud Brigman, Lindsey Brigman et leurs équipiers découvrent une présence inconnue dans les profondeurs. Leur mission de récupération se transforme en une confrontation avec un phénomène qui dépasse tout ce qu'ils imaginaient.
