  - id: avatar-2009
    titre: Avatar
    année: 2009
    auteur: James Cameron
    acteurs_principaux: Sam Worthington, Zoe Saldaña, Sigourney Weaver
    synopsis: Sur la lune Pandora, Jake Sully, ancien marine paraplégique, prend la place de son frère décédé au sein du programme Avatar. Son esprit est transféré dans un corps Na'vi conçu pour permettre aux humains d'explorer une planète dont l'atmosphère leur est toxique. Chargé de gagner la confiance des habitants au profit d'une exploitation minière, Jake se rapproche de Neytiri et remet progressivement en question la mission qui lui a été confiée.
